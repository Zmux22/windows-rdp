name: Ngrok Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Download ngrok
        shell: powershell
        run: |
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

          .\ngrok.exe version

      - name: Configure ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          .\ngrok.exe config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Start local test server
        shell: powershell
        run: |
          Start-Process powershell -ArgumentList '-NoProfile -Command "python -m http.server 8080"' -WindowStyle Hidden
          Start-Sleep -Seconds 3

      - name: Start ngrok
        shell: powershell
        run: |
          .\ngrok.exe http 8080
