name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime in minutes (maximum 355)"
        required: false
        default: "355"
        type: string

      test_mode:
        description: "Run 5-minute test"
        required: false
        default: false
        type: boolean

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ---------------------------------------------------------
      # 1. Resolve runtime
      # ---------------------------------------------------------
      - name: Resolve runtime
        id: config
        env:
          RAW_RUNTIME: ${{ inputs.runtime_minutes }}
          RAW_TEST: ${{ inputs.test_mode }}
        run: |
          function ToIntOr {
              param(
                  [string]$Value,
                  [int]$Default
              )

              if ($Value -match '^\d+$') {
                  return [int]$Value
              }

              return $Default
          }

          $isTest = $env:RAW_TEST -match '^(?i:true|1|yes|on)$'

          $runtime = ToIntOr $env:RAW_RUNTIME 355

          if ($isTest) {
              $runtime = 5
          }

          if (-not $isTest -and $runtime -lt 1) {
              $runtime = 355
          }

          if ($runtime -gt 355) {
              $runtime = 355
          }

          "runtime=$runtime" >> $env:GITHUB_OUTPUT

          Write-Host "Test mode : $isTest"
          Write-Host "Runtime   : $runtime minutes"


      # ---------------------------------------------------------
      # 2. Install Tailscale
      # ---------------------------------------------------------
      - name: Install Tailscale
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
              $installer = "$env:TEMP\tailscale-setup.exe"

              Write-Host "Downloading Tailscale..."

              Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $installer `
                  -UseBasicParsing

              Start-Process `
                  -FilePath $installer `
                  -ArgumentList "/quiet" `
                  -Wait

              Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          if (-not (Test-Path $ts)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          & $ts version


      # ---------------------------------------------------------
      # 3. Configure RDP
      # ---------------------------------------------------------
      - name: Enable RDP
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          if (-not $env:RDP_USER -or -not $env:RDP_PASS) {
              Write-Error "RDP_USER or RDP_PASS secret is missing."
              exit 1
          }

          $user = $env:RDP_USER

          $securePassword = ConvertTo-SecureString `
              $env:RDP_PASS `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name $user `
              -ErrorAction SilentlyContinue

          if (-not $existingUser) {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                  -Name $user `
                  -Password $securePassword `
                  -AccountNeverExpires `
                  -PasswordNeverExpires:$true

          }
          else {

              Write-Host "Updating existing RDP user..."

              Set-LocalUser `
                  -Name $user `
                  -Password $securePassword

              Enable-LocalUser `
                  -Name $user
          }

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $user `
              -ErrorAction SilentlyContinue

          # Enable RDP
          Set-ItemProperty `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          # Require Network Level Authentication
          Set-ItemProperty `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Value 1

          # Enable Windows Firewall RDP rules
          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop" `
              -ErrorAction SilentlyContinue

          Write-Host "RDP configuration completed."


      # ---------------------------------------------------------
      # 4. Connect Tailscale
      # ---------------------------------------------------------
      - name: Connect Tailscale
        id: tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
              Write-Error "TS_AUTHKEY secret is missing."
              exit 1
          }

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Logging out previous Tailscale session..."

          & $ts logout 2>$null

          Start-Sleep -Seconds 2

          Write-Host "Connecting to Tailscale..."

          & $ts up `
              --authkey="$env:TS_AUTHKEY" `
              --hostname="$env:TS_HOSTNAME" `
              --accept-routes `
              --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Start-Sleep -Seconds 3

          $ip4 = (& $ts ip -4 | Select-Object -First 1).Trim()

          if (-not $ip4) {
              Write-Error "Could not obtain Tailscale IPv4 address."
              exit 1
          }

          $statusRaw = & $ts status --json

          $status = $statusRaw | ConvertFrom-Json

          $fqdn = $status.Self.DNSName
          $derp = $status.Self.DERP

          "ip4=$ip4" >> $env:GITHUB_OUTPUT
          "fqdn=$fqdn" >> $env:GITHUB_OUTPUT
          "derp=$derp" >> $env:GITHUB_OUTPUT

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Tailscale connected"
          Write-Host "Hostname : $env:TS_HOSTNAME"
          Write-Host "IPv4     : $ip4"
          Write-Host "FQDN     : $fqdn"
          Write-Host "DERP     : $derp"
          Write-Host "======================================"
          Write-Host ""


      # ---------------------------------------------------------
      # 5. Display connection information
      # ---------------------------------------------------------
      - name: RDP Connection Information
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          TS_IP: ${{ steps.tailscale.outputs.ip4 }}
          TS_FQDN: ${{ steps.tailscale.outputs.fqdn }}
        run: |
          @"
          ## Windows RDP

          **Tailscale Hostname:** `$env:TS_HOSTNAME`

          **Tailscale IPv4:** `$env:TS_IP`

          **MagicDNS:** `$env:TS_FQDN`

          **RDP Username:** `$env:RDP_USER`

          Connect using:

          ```text
          mstsc /v:$env:TS_IP
          ```

          Or use the MagicDNS hostname:

          ```text
          mstsc /v:$env:TS_FQDN
          ```

          The RDP password is stored in GitHub Secret `RDP_PASS`.
          "@ | Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8


      # ---------------------------------------------------------
      # 6. Keep runner alive
      # ---------------------------------------------------------
      - name: Keep RDP alive
        env:
          RUNTIME: ${{ steps.config.outputs.runtime }}
        run: |
          $minutes = [int]$env:RUNTIME

          $end = (Get-Date).AddMinutes($minutes)

          Write-Host "RDP will remain available for $minutes minutes."

          while ((Get-Date) -lt $end) {

              $remaining = $end - (Get-Date)

              $remainingMinutes = [math]::Ceiling(
                  $remaining.TotalMinutes
              )

              Write-Host "RDP alive - $remainingMinutes minutes remaining"

              Start-Sleep -Seconds 60
          }

          Write-Host "Runtime finished."


      # ---------------------------------------------------------
      # 7. Disconnect Tailscale
      # ---------------------------------------------------------
      - name: Disconnect Tailscale
        if: always()
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
              Write-Host "Disconnecting Tailscale..."

              & $ts logout 2>$null

              Write-Host "Tailscale disconnected."
          }


      # ---------------------------------------------------------
      # 8. Final message
      # ---------------------------------------------------------
      - name: Finished
        if: always()
        run: |
          Write-Host "RDP workflow finished."
